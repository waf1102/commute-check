services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/commute_check.db
      - JOBS_DB_URL=sqlite:///data/jobs.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - VAPID_KEY_FILE=/app/data/vapid-keys.json
    volumes:
      - commute_data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    depends_on:
      - backend
    restart: always

volumes:
  commute_data:
